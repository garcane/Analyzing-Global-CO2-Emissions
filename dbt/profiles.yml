# Committed on purpose: it contains no secrets, only env_var() lookups (values come from .env locally,
# from GitHub Actions secrets in CI). Key-pair auth; the key itself never lives in the repo.
gei:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('DBT_SNOWFLAKE_USER') }}"
      role: "{{ env_var('DBT_SNOWFLAKE_ROLE') }}"
      private_key_path: "{{ env_var('DBT_SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      database: "{{ env_var('GEI_ANALYTICS_DATABASE', 'GEI_ANALYTICS') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'GEI_WH') }}"
      # Personal sandbox: models build into dbt_<suffix>_staging / _intermediate / _marts.
      schema: "dbt_{{ env_var('DBT_DEV_SUFFIX', 'dev') }}"
      threads: 4
      query_tag: gei-dbt
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('DBT_SNOWFLAKE_USER') }}"
      role: "{{ env_var('DBT_SNOWFLAKE_ROLE') }}"
      private_key_path: "{{ env_var('DBT_SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      database: "{{ env_var('GEI_ANALYTICS_DATABASE', 'GEI_ANALYTICS') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'GEI_WH') }}"
      # Exact STAGING / INTERMEDIATE / MARTS schemas (see macros/generate_schema_name.sql).
      schema: analytics
      threads: 4
      query_tag: gei-dbt
