name: dbt build on Snowflake (manual)

# Runs the real dbt build and tests against Snowflake. Manual only, and it needs a reviewer to approve
# the `snowflake-trial` environment, so no secret is exposed to pull requests or forks and no credits
# are spent on every push. It builds into a throwaway schema (dbt_ci_<run id>_*) and drops it afterwards;
# it never writes the prod STAGING / INTERMEDIATE / MARTS schemas.
# Stops being useful when the Snowflake trial ends; ci.yml keeps working.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dbt-snowflake
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: snowflake-trial
    env:
      # Non-secret settings. GEI_CI is a dedicated role: read GEI_RAW, create schemas in GEI_ANALYTICS,
      # and nothing else, so even a mistake here cannot write the prod schemas.
      DBT_SNOWFLAKE_ROLE: GEI_CI
      DBT_DEV_SUFFIX: ci_${{ github.run_id }}
      GEI_RAW_DATABASE: GEI_RAW
      GEI_ANALYTICS_DATABASE: GEI_ANALYTICS
      SNOWFLAKE_WAREHOUSE: GEI_WH
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Write the CI private key (from a secret) to a temporary file
        env:
          CI_KEY: ${{ secrets.CI_SNOWFLAKE_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$CI_KEY" > "$RUNNER_TEMP/ci_key.p8"
          # Later steps (dbt reads this) and the cleanup step use the same path.
          echo "DBT_SNOWFLAKE_PRIVATE_KEY_PATH=$RUNNER_TEMP/ci_key.p8" >> "$GITHUB_ENV"

      # Explains a "JWT token is invalid" login failure without exposing any secret: it prints whether each
      # secret equals the expected non-secret value, the shape of the key file, and the PUBLIC key
      # fingerprint to compare with `DESC USER GEI_CI_SVC` (RSA_PUBLIC_KEY_FP) in Snowflake.
      - name: Pre-flight check of the credentials (prints no secret)
        env:
          SF_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SF_USER: ${{ secrets.CI_SNOWFLAKE_USER }}
          EXPECTED_ACCOUNT: GWEPWIG-CA86069
          EXPECTED_USER: GEI_CI_SVC
        run: |
          f="$DBT_SNOWFLAKE_PRIVATE_KEY_PATH"
          if [ "$SF_ACCOUNT" = "$EXPECTED_ACCOUNT" ]; then echo "SNOWFLAKE_ACCOUNT: equals the expected value"; else echo "SNOWFLAKE_ACCOUNT: DIFFERS from the expected value (length ${#SF_ACCOUNT}, expected ${#EXPECTED_ACCOUNT})"; fi
          if [ "$SF_USER" = "$EXPECTED_USER" ]; then echo "CI_SNOWFLAKE_USER: equals the expected value"; else echo "CI_SNOWFLAKE_USER: DIFFERS from the expected value (length ${#SF_USER}, expected ${#EXPECTED_USER})"; fi
          echo "key file: $(wc -l < "$f") lines, first line '$(head -1 "$f" | tr -d '\r')', carriage returns: $(tr -cd '\r' < "$f" | wc -c)"
          if fp=$(openssl pkey -in "$f" -pubout -outform DER 2>/dev/null | openssl dgst -sha256 -binary | openssl base64) && [ -n "$fp" ]; then
            echo "public key fingerprint: SHA256:$fp"
          else
            echo "key file is NOT a readable private key (empty, truncated or wrong format)"
          fi

      - name: dbt seed, build and freshness
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          DBT_SNOWFLAKE_USER: ${{ secrets.CI_SNOWFLAKE_USER }}
        run: |
          uv run python dbt/run_dbt.py debug
          uv run python dbt/run_dbt.py build
          uv run python dbt/run_dbt.py source freshness

      - name: Drop the throwaway CI schemas (always)
        if: always()
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          DBT_SNOWFLAKE_USER: ${{ secrets.CI_SNOWFLAKE_USER }}
        # Block scalar on purpose: an unquoted "{suffix: ...}" inside a one-line YAML value is invalid YAML.
        # DBT_DEV_SUFFIX (ci_<run id>) is set at job level above.
        run: |
          uv run python dbt/run_dbt.py run-operation drop_ci_schemas --args "{suffix: $DBT_DEV_SUFFIX}"

      - name: Remove the private key file (always)
        if: always()
        run: rm -f "$DBT_SNOWFLAKE_PRIVATE_KEY_PATH"
